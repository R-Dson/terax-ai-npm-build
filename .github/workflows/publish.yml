name: Auto-Sync Build and Publish

on:
  schedule:
    - cron: '0 */6 * * *' # Check every 6 hours
  workflow_dispatch:      # Keep the manual button

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      new_version_found: ${{ steps.compare.outputs.new_version_found }}
      version: ${{ steps.upstream.outputs.tag }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Get Upstream Version
        id: upstream
        run: |
          # Fetch the latest release tag from the original creator
          TAG=$(curl -s https://api.github.com/repos/crynta/terax-ai/releases/latest | jq -r .tag_name | sed 's/v//')
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Compare Versions
        id: compare
        run: |
          LOCAL_VER=$(jq -r .version package.json)
          UPSTREAM_VER=${{ steps.upstream.outputs.tag }}
          if [ "$LOCAL_VER" != "$UPSTREAM_VER" ]; then
            echo "new_version_found=true" >> $GITHUB_OUTPUT
          else
            echo "new_version_found=false" >> $GITHUB_OUTPUT
          fi

  build-binaries:
    needs: check-version
    if: needs.check-version.outputs.new_version_found == 'true' || github.event_name == 'workflow_dispatch'
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            output_name: terax-linux-x64
            binary_path: src-tauri/target/release/terax
          - os: macos-14
            output_name: terax-darwin-arm64
            binary_path: src-tauri/target/release/terax
          - os: windows-latest
            output_name: terax-win32-x64.exe
            binary_path: src-tauri/target/release/terax.exe

    steps:
      - name: Checkout Original Repository
        uses: actions/checkout@v4
        with:
          repository: crynta/terax-ai

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Project Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Force Version Sync
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.dependencies['@tauri-apps/api'] = '~2.10.0';
            pkg.devDependencies['@tauri-apps/cli'] = '~2.10.0';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          pnpm install --no-frozen-lockfile

      - name: Build Tauri App
        run: pnpm tauri build --no-bundle
        env:
          TAURI_CLI_SKIP_VERSION_CHECK: true

      - name: Rename and Prepare Binary
        shell: bash
        run: |
          mkdir -p final-bin/
          mv ${{ matrix.binary_path }} final-bin/${{ matrix.output_name }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: final-bin/

  publish-and-update-repo:
    needs: [check-version, build-binaries]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_GITHUB_TOKEN }} # Use PAT to allow triggers

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin/
          merge-multiple: true

      - name: Fix Executable Permissions
        run: chmod +x bin/terax-* bin/terax.js

      - name: Update package.json version
        run: |
          NEW_VER=${{ needs.check-version.outputs.version }}
          jq ".version = \"$NEW_VER\"" package.json > package.json.tmp && mv package.json.tmp package.json

      - name: Authenticate and Publish to NPM
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump back to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: sync with upstream version ${{ needs.check-version.outputs.version }}"
          git push

  cleanup-runs:
    name: Clean Up Skipped Runs
    runs-on: ubuntu-latest
    # Needs check-version just so it runs alongside or after it
    needs: check-version
    # Requires permission to delete workflow runs
    permissions:
      actions: write
    steps:
      - name: Delete past skipped runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Get the current workflow's internal ID
          WORKFLOW_ID=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq '.workflow_id')
          
          # 2. Fetch the last 50 completed, successful runs of THIS workflow
          # (Excludes the current in-progress run automatically)
          RUNS=$(gh api repos/${{ github.repository }}/actions/workflows/$WORKFLOW_ID/runs?per_page=50 --jq '.workflow_runs[] | select(.status=="completed" and .conclusion=="success") | .id')
          
          for RUN_ID in $RUNS; do
            # 3. Check the conclusion of the 'publish-and-update-repo' job for this specific run
            CONCLUSION=$(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs --jq '.jobs[] | select(.name=="publish-and-update-repo") | .conclusion' || echo "")
            
            # 4. If the publish step was skipped, it means no update was found. Delete it!
            if [ "$CONCLUSION" == "skipped" ]; then
              echo "Run $RUN_ID found no updates and skipped publishing. Deleting..."
              gh api -X DELETE repos/${{ github.repository }}/actions/runs/$RUN_ID --silent || echo "Failed to delete $RUN_ID"
            fi
          done
