name: Auto-Sync Build and Publish

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Force build and publish even if version is unchanged'
        required: false
        type: boolean
        default: false

# Prevent parallel runs from clashing
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      new_version_found: ${{ steps.compare.outputs.new_version_found }}
      version: ${{ steps.upstream.outputs.tag }}
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Get Upstream Version
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use gh api to avoid rate limits
          TAG=$(gh api repos/crynta/terax-ai/releases/latest --jq '.tag_name' | sed 's/v//')
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Compare Versions
        id: compare
        run: |
          LOCAL_VER=$(jq -r .version package.json)
          UPSTREAM_VER=${{ steps.upstream.outputs.tag }}
          if [ "$LOCAL_VER" != "$UPSTREAM_VER" ]; then
            echo "new_version_found=true" >> $GITHUB_OUTPUT
          else
            echo "new_version_found=false" >> $GITHUB_OUTPUT
          fi

  build-binaries:
    needs: check-version
    if: needs.check-version.outputs.new_version_found == 'true' || github.event.inputs.force_publish == 'true'
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            output_name: terax-linux-x64
            binary_path: src-tauri/target/release/terax
          - os: ubuntu-22.04-arm
            output_name: terax-linux-arm64
            binary_path: src-tauri/target/release/terax
          - os: macos-14
            output_name: terax-darwin-arm64
            binary_path: src-tauri/target/release/terax
          #- os: macos-13
          #  output_name: terax-darwin-x64
          #  binary_path: src-tauri/target/release/terax
          - os: windows-latest
            output_name: terax-win32-x64.exe
            binary_path: src-tauri/target/release/terax.exe

    steps:
      - name: Checkout Original Repository
        uses: actions/checkout@v6
        with:
          repository: crynta/terax-ai

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Project Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Force Version Sync
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.dependencies['@tauri-apps/api'] = '~2.10.0';
            pkg.devDependencies['@tauri-apps/cli'] = '~2.10.0';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          pnpm install --no-frozen-lockfile

      - name: Build Tauri App
        run: pnpm tauri build --no-bundle
        env:
          TAURI_CLI_SKIP_VERSION_CHECK: true

      - name: Rename and Prepare Binary
        shell: bash
        run: |
          mkdir -p final-bin/
          mv ${{ matrix.binary_path }} final-bin/${{ matrix.output_name }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: final-bin/

  publish-and-update-repo:
    needs: [check-version, build-binaries]
    runs-on: ubuntu-latest
    if: needs.build-binaries.result == 'success'
    steps:
      - name: Checkout Your Repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.MY_GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin/
          merge-multiple: true

      - name: Fix Executable Permissions
        run: chmod +x bin/terax-*

      - name: Update package.json version
        run: |
          NEW_VER=${{ needs.check-version.outputs.version }}
          jq ".version = \"$NEW_VER\"" package.json > package.json.tmp && mv package.json.tmp package.json

      - name: Authenticate and Publish to NPM
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --access public || echo "Version already exists on NPM."
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump back to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          if ! git diff --cached --exit-code; then
            git commit -m "chore: sync with upstream version ${{ needs.check-version.outputs.version }}"
            git push
          else
            echo "No changes to commit."
          fi

  cleanup-runs:
    name: Clean Up Skipped Runs
    runs-on: ubuntu-latest
    needs: [check-version, build-binaries]
    if: always()
    permissions:
      actions: write
    steps:
      - name: Delete past skipped runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Get the current workflow ID
          WORKFLOW_ID=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq '.workflow_id')
          
          # 2. Fetch the last 50 runs that are completed and successful
          RUNS=$(gh api "repos/${{ github.repository }}/actions/workflows/$WORKFLOW_ID/runs?per_page=50" \
            --jq ".workflow_runs[] | select(.id != ${{ github.run_id }} and .status==\"completed\" and .conclusion==\"success\") | .id")
          
          for RUN_ID in $RUNS; do
            # 3. Check if the non-matrix job "publish-and-update-repo" was skipped
            CONCLUSION=$(gh api repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs \
              --jq '.jobs[] | select(.name == "publish-and-update-repo") | .conclusion' || echo "notfound")
            
            # 4. Use grep to safely check the conclusion
            if echo "$CONCLUSION" | grep -q "skipped"; then
              echo "Run $RUN_ID was a version check only (build skipped). Deleting..."
              gh run delete $RUN_ID --repo ${{ github.repository }}
            fi
          done
