publish-npm:
    name: Publish to NPM
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Wrapper Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # We'll handle the registry config manually to ensure it works

      - name: Create Bin Directory
        run: mkdir -p bin/

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin/
          merge-multiple: true

      - name: Fix Executable Permissions
        run: chmod +x bin/terax-* bin/terax.js

      - name: Authenticate and Publish
        run: |
          # Create .npmrc file to link the token to the registry
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
