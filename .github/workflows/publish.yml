name: Auto-Sync Build and Publish

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Force build and publish even if version is unchanged'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      new_version_found: ${{ steps.compare.outputs.new_version_found }}
      version: ${{ steps.upstream.outputs.tag }}
      npm_version: ${{ steps.compare.outputs.npm_version }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Get Upstream Version
        id: upstream
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh api repos/crynta/terax-ai/releases/latest --jq '.tag_name' | sed 's/^v//')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Upstream latest release version: $TAG"

      - name: Compare Versions
        id: compare
        shell: bash
        run: |
          PACKAGE_NAME=$(jq -r .name package.json)
          LOCAL_VER=$(jq -r .version package.json)

          NPM_VER=$(npm view "$PACKAGE_NAME" version 2>/dev/null || echo "0.0.0")
          UPSTREAM_VER="${{ steps.upstream.outputs.tag }}"

          echo "Package name: $PACKAGE_NAME"
          echo "Local package.json version: $LOCAL_VER"
          echo "NPM published version: $NPM_VER"
          echo "Upstream latest release version: $UPSTREAM_VER"

          echo "npm_version=$NPM_VER" >> "$GITHUB_OUTPUT"

          if [ "$NPM_VER" != "$UPSTREAM_VER" ]; then
            echo "new_version_found=true" >> "$GITHUB_OUTPUT"
            echo "NPM is behind upstream. Build and publish required."
          else
            echo "new_version_found=false" >> "$GITHUB_OUTPUT"
            echo "NPM is already up to date."
          fi

  build-binaries:
    needs: check-version
    if: needs.check-version.outputs.new_version_found == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_publish)
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            output_name: terax-linux-x64
            binary_path: src-tauri/target/release/terax

          - os: ubuntu-22.04-arm
            output_name: terax-linux-arm64
            binary_path: src-tauri/target/release/terax

          - os: macos-14
            output_name: terax-darwin-arm64
            binary_path: src-tauri/target/release/terax

          # - os: macos-13
          #   output_name: terax-darwin-x64
          #   binary_path: src-tauri/target/release/terax

          - os: windows-2025
            output_name: terax-win32-x64.exe
            binary_path: src-tauri/target/release/terax.exe

    steps:
      - name: Checkout Original Repository
        uses: actions/checkout@v6
        with:
          repository: crynta/terax-ai

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify Node and npm
        shell: bash
        run: |
          node --version
          npm --version

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Patch Project to Build Without pnpm
        shell: bash
        run: |
          echo "Patching package.json and src-tauri/tauri.conf.json to avoid pnpm..."

          node <<'NODE'
          const fs = require('fs');

          const pkgPath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));

          pkg.dependencies = pkg.dependencies || {};
          pkg.devDependencies = pkg.devDependencies || {};

          // Match Rust tauri crate 2.11.x.
          pkg.dependencies['@tauri-apps/api'] = '~2.11.0';
          pkg.devDependencies['@tauri-apps/cli'] = '~2.11.0';

          // Avoid setup/corepack/npm trying to enforce pnpm.
          delete pkg.packageManager;

          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

          const tauriConfigPath = 'src-tauri/tauri.conf.json';
          const tauriConfig = JSON.parse(fs.readFileSync(tauriConfigPath, 'utf8'));

          tauriConfig.build = tauriConfig.build || {};
          tauriConfig.build.beforeBuildCommand = 'npm run build';

          if (tauriConfig.build.beforeDevCommand) {
            tauriConfig.build.beforeDevCommand = 'npm run dev';
          }

          fs.writeFileSync(tauriConfigPath, JSON.stringify(tauriConfig, null, 2) + '\n');
          NODE

          echo "Tauri JS package versions after patch:"
          node -e "const p=require('./package.json'); console.log('@tauri-apps/api:', p.dependencies?.['@tauri-apps/api']); console.log('@tauri-apps/cli:', p.devDependencies?.['@tauri-apps/cli']);"

          echo "Remaining pnpm references in patched files:"
          grep -R "pnpm" package.json src-tauri/tauri.conf.json || true

      - name: Install Project Dependencies with npm
        shell: bash
        run: |
          npm config set fund false
          npm config set audit false
          npm install --legacy-peer-deps --no-package-lock

      - name: Build Tauri App
        shell: bash
        run: |
          npx --yes @tauri-apps/cli@2.11.0 build --no-bundle
        env:
          TAURI_CLI_SKIP_VERSION_CHECK: true

      - name: Rename and Prepare Binary
        shell: bash
        run: |
          mkdir -p final-bin/
          mv "${{ matrix.binary_path }}" "final-bin/${{ matrix.output_name }}"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ matrix.output_name }}
          path: final-bin/

  publish-and-update-repo:
    needs: [check-version, build-binaries]
    runs-on: ubuntu-latest
    if: needs.build-binaries.result == 'success'

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout Your Repo
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.MY_GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify Node and npm
        shell: bash
        run: |
          node --version
          npm --version
          npm install -g npm@latest
          npm --version

      - name: Download All Artifacts
        uses: actions/download-artifact@v4.3.0
        with:
          path: bin/
          merge-multiple: true

      - name: List Downloaded Artifacts
        shell: bash
        run: |
          echo "Downloaded files:"
          find bin -maxdepth 2 -type f -print

      - name: Fix Executable Permissions
        shell: bash
        run: |
          chmod +x bin/terax-* || true

      - name: Update package.json version
        shell: bash
        run: |
          NEW_VER="${{ needs.check-version.outputs.version }}"

          echo "Updating package.json version to $NEW_VER"

          jq ".version = \"$NEW_VER\"" package.json > package.json.tmp
          mv package.json.tmp package.json

      - name: Fix npm package metadata
        shell: bash
        run: |
          npm pkg fix

      - name: Publish to NPM with Trusted Publishing
        shell: bash
        run: |
          set -euo pipefail

          npm config set registry https://registry.npmjs.org/

          echo "Publishing version ${{ needs.check-version.outputs.version }} to NPM using trusted publishing..."
          npm publish --access public

      - name: Commit version bump back to repo
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add package.json

          if ! git diff --cached --exit-code; then
            git commit -m "chore: sync with upstream version ${{ needs.check-version.outputs.version }}"
            git push
          else
            echo "No changes to commit."
          fi

  cleanup-runs:
    name: Clean Up Skipped and Cancelled Runs
    runs-on: ubuntu-latest
    needs: [check-version, build-binaries]
    if: always()

    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete past skipped and cancelled runs
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WORKFLOW_ID=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} --jq '.workflow_id')

          echo "Current workflow ID: $WORKFLOW_ID"
          echo "Current run ID: ${{ github.run_id }}"

          RUNS=$(gh api "repos/${{ github.repository }}/actions/workflows/$WORKFLOW_ID/runs?per_page=100&status=completed" \
            --jq ".workflow_runs[] | select(.id != ${{ github.run_id }}) | {id: .id, conclusion: .conclusion}")

          echo "$RUNS" | jq -c '.' | while read -r RUN; do
            RUN_ID=$(echo "$RUN" | jq -r '.id')
            RUN_CONCLUSION=$(echo "$RUN" | jq -r '.conclusion')

            if [ "$RUN_CONCLUSION" = "cancelled" ]; then
              echo "Run $RUN_ID was cancelled. Deleting..."
              gh run delete "$RUN_ID" --repo "${{ github.repository }}"
              continue
            fi

            if [ "$RUN_CONCLUSION" = "success" ]; then
              PUBLISH_CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs" \
                --jq '.jobs[] | select(.name == "publish-and-update-repo") | .conclusion' || echo "notfound")

              if echo "$PUBLISH_CONCLUSION" | grep -q "skipped"; then
                echo "Run $RUN_ID was a version check only. Deleting..."
                gh run delete "$RUN_ID" --repo "${{ github.repository }}"
              fi
            fi
          done
