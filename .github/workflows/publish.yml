name: Build and Publish to NPM

on:
  workflow_dispatch:

jobs:
  build-binaries:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            output_name: terax-linux-x64
            binary_path: src-tauri/target/release/terax
          - os: macos-13
            output_name: terax-darwin-x64
            binary_path: src-tauri/target/release/terax
          - os: macos-14
            output_name: terax-darwin-arm64
            binary_path: src-tauri/target/release/terax
          - os: windows-latest
            output_name: terax-win32-x64.exe
            binary_path: src-tauri/target/release/terax.exe

    steps:
      - name: Checkout Original Repository
        uses: actions/checkout@v4
        with:
          repository: crynta/terax-ai

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Project Dependencies
        run: pnpm install --no-frozen-lockfile

      # This step worked! It prevents the CLI from stopping the build.
      - name: Force Version Sync
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.dependencies['@tauri-apps/api'] = '~2.10.0';
            pkg.devDependencies['@tauri-apps/cli'] = '~2.10.0';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          pnpm install --no-frozen-lockfile

      # Clean build command without invalid flags
      - name: Build Tauri App
        run: pnpm tauri build --no-bundle
        env:
          TAURI_CLI_SKIP_VERSION_CHECK: true

      - name: Rename and Prepare Binary
        shell: bash
        run: |
          mkdir -p final-bin/
          mv ${{ matrix.binary_path }} final-bin/${{ matrix.output_name }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: final-bin/

  publish-npm:
    name: Publish to NPM
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Your Wrapper Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Create Bin Directory
        run: mkdir -p bin/

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: bin/
          merge-multiple: true

      - name: Fix Executable Permissions
        run: chmod +x bin/terax-* bin/terax.js

      - name: Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
